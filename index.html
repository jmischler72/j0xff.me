    }
    .health-indicator.healthy   { background: #5a5; }

  <hr>

  <h2>Root Me</h2>
  <!-- rootme-stats -->
  <p>stats not yet fetched</p>
  <!-- /rootme-stats -->


  <script>
    function checkHealth(indicator) {
      const url = indicator.dataset.url;
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 5000);

      fetch(url, { mode: 'no-cors', signal: controller.signal })
        .then(() => {
          indicator.classList.remove('unhealthy');
          indicator.classList.add('healthy');
        })
        .catch(err => {
          if (err.name === 'AbortError') {
            indicator.classList.remove('healthy');
            indicator.classList.add('unhealthy');
          } else {
            // CORS restricted — treat as healthy
            indicator.classList.remove('unhealthy');
            indicator.classList.add('healthy');
          }
        })
        .finally(() => clearTimeout(timeout));
    }

    function initHealthChecks() {
      const indicators = document.querySelectorAll('.health-indicator[data-url]');
      indicators.forEach(indicator => {
        checkHealth(indicator);
        setInterval(() => checkHealth(indicator), 30000);
      });
    }

    document.addEventListener('DOMContentLoaded', initHealthChecks);
  </script>
</body>
